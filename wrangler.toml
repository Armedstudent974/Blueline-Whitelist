name = "blueline-whitelist"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Live on your domain
routes = [{ pattern = "dmpforge.co.uk", custom_domain = true }]

[vars]
BASE_URL = "https://dmpforge.co.uk"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "dmpforge-applications"
database_id = "92005a18-aed8-4cf2-b277-4eedb7ce3253"

# Keeps the Discord gateway connection (DM answers) alive 24/7
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]

# Watchdog: makes sure the bot is connected every minute
[triggers]
crons = ["* * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
